<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Canvas Display</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        
        .container {
            text-align: center;
        }
        
        canvas {
            border: 2px solid #333;
            background-color: white;
            margin: 20px auto;
            display: block;
        }
        
        .controls {
            margin: 20px 0;
        }
        
        .controls button {
            margin: 0 10px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .controls button:hover {
            background-color: #45a049;
        }
        
        .controls button:active {
            background-color: #3d8b40;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Paint Mixing Distortion Effect</h1>
        <canvas id="imageCanvas" width="600" height="600"></canvas>
        
        <div class="controls">
            <button onclick="stopPaintMixingEffect()">Stop Effect</button>
            <button onclick="startPaintMixingEffect()">Start Effect</button>
            <button onclick="resetImage()">Reset to Original</button>
            <button onclick="toggleGrid()">Show Grid</button>
        </div>
    </div>
    
    <script src="distort.js"></script>
</body>
</html>
