<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Mixing Distortion Effect</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <img id="warp-image" src="../images/image.png" alt="" hidden />

    <canvas id="canvas" width="600" height="600"></canvas>

    <div class="controls">
        <label class="control-field">
            <span>Grid size</span>
            <input id="grid-size" type="number" min="10" max="200" step="5" value="150" />
        </label>

        <label class="control-field">
            <span>Keep grid fixed</span>
            <input id="keep-grid-fixed" type="checkbox" checked />
        </label>

        <button id="restart">Restart</button>
        <button id="pause">Pause</button>
        <button id="reset">Reset to Original</button>
        <button id="toggle-grid">Hide Grid</button>
    </div>

    <script src="distort.js"></script>
</body>
</html>
