<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bump Mapping Demo</title>
  <style>
    html,body{height:100%;margin:0;background:#111;color:#ddd;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    #container{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
    canvas{display:block;max-width:80%;max-height:80%;height:auto;width:auto;box-shadow:0 10px 30px rgba(0,0,0,0.7)}
    #info{position:fixed;left:12px;top:12px;background:rgba(0,0,0,0.45);padding:8px 10px;border-radius:6px;font-size:13px}
  </style>
</head>
<body>
  <div id="container">
    <canvas id="bump-canvas" aria-label="Bump mapping canvas">Your browser does not support the canvas element.</canvas>
  </div>
  <div id="info">Bump-mapping demo — light moves randomly</div>
  <script src="bump.js"></script>
</body>
</html>
